[package]
name = "la-estanteria"
version = "0.3.1"
description = "La Estantería: lee tus cómics, manga y libros de El Archivador"
authors = ["Iker Lorente"]
license = "PolyForm-Noncommercial-1.0.0"
edition = "2021"
rust-version = "1.77"

[lib]
name = "la_estanteria_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# the user's app token, in the operating system's credential store (Windows Credential Manager)
keyring = { version = "3", features = ["windows-native", "apple-native", "sync-secret-service"] }
# downloads for reading offline (blocking, in their own threads; rustls, no OpenSSL to ship)
ureq = { version = "2.12", default-features = false, features = ["tls"] }
# comics of this computer (a double click in the Explorer): zip, 7z and rar, unpacked in Rust
zip = { version = "2", default-features = false, features = ["deflate"] }
sevenz-rust = "0.6"
unrar = "0.5"
imagesize = "0.13"
# covers made small, PDF pages rendered (PDFium, the PDF engine of Chrome, as a DLL next to the app)
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
pdfium-render = { version = "0.8", default-features = false, features = ["pdfium_latest", "sync"] }
tauri-plugin-dialog = "2"
# a second launch (a double click with the app open) hands its file to the window already open
tauri-plugin-single-instance = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
